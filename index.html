<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Morelimbau AR — Protótipo 01</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#101010; font-family:Arial,sans-serif; }
    #intro { position:fixed; z-index:5; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; padding:28px; color:#fff; text-align:center; background:linear-gradient(145deg,#17121d,#29210f); }
    #intro h1 { margin:0; font-size:clamp(30px,8vw,48px); letter-spacing:2px; }
    #intro p { max-width:420px; line-height:1.5; color:#ddd; }
    #start { border:0; border-radius:8px; padding:15px 24px; background:#ff5a1f; color:#111; font-size:17px; font-weight:800; }
    #hint { position:fixed; z-index:4; top:14px; left:12px; right:12px; padding:10px 12px; color:white; background:#111c; border:1px solid #ffffff44; border-radius:8px; text-align:center; font-size:14px; pointer-events:none; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="intro">
    <h1>MORELIMBAU AR</h1>
    <p>Protótipo 01 · Aponte a câmera para a ilustração impressa do Morelimbau. Quando ela for reconhecida, a arte ganhará movimento.</p>
    <button id="start">INICIAR EXPERIÊNCIA</button>
    <small>Permita o acesso à câmera quando o navegador solicitar.</small>
  </div>
  <div id="hint" class="hidden">Procure a ilustração Morelimbau e mantenha-a inteira no enquadramento.</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: true; uiLoading: no; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Explosão gráfica 2D em camadas sobre a ilustração -->
      <a-ring position="0 0.12 0.02" radius-inner="0.48" radius-outer="0.55"
        color="#ff5a1f" material="shader: flat; opacity: 0.9; side: double"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 7000"
        animation__pulse="property: scale; from: 0.82 0.82 0.82; to: 1.12 1.12 1.12; dir: alternate; loop: true; dur: 900">
      </a-ring>

      <a-plane position="0 0.05 0.04" width="1.15" height="0.16" color="#ff5a1f"
        material="shader: flat; opacity: 0.92; side: double"
        animation="property: rotation; from: 0 0 -5; to: 0 0 5; dir: alternate; loop: true; dur: 550">
      </a-plane>

      <a-text value="A ARTE GANHOU VIDA!" position="0 0.05 0.06"
        align="center" color="#fff4d6" width="2.1"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
        animation="property: scale; from: 0.85 0.85 0.85; to: 1.08 1.08 1.08; dir: alternate; loop: true; dur: 650">
      </a-text>

      <a-text value="MORELIMBAU • AR 001" position="0 -0.62 0.04"
        align="center" color="#ff5a1f" width="1.8">
      </a-text>

      <a-sphere position="-0.55 0.48 0.05" radius="0.055" color="#b7e321"
        material="shader: flat"
        animation="property: position; from: -0.55 0.38 0.05; to: -0.55 0.62 0.05; dir: alternate; loop: true; dur: 850">
      </a-sphere>
      <a-sphere position="0.55 -0.38 0.05" radius="0.045" color="#ff5a1f"
        material="shader: flat"
        animation="property: position; from: 0.55 -0.5 0.05; to: 0.55 -0.25 0.05; dir: alternate; loop: true; dur: 700">
      </a-sphere>
    </a-entity>
  </a-scene>

  <script>
    const start = document.getElementById('start');
    const intro = document.getElementById('intro');
    const hint = document.getElementById('hint');
    const sceneEl = document.querySelector('a-scene');

    start.addEventListener('click', async () => {
      try {
        intro.classList.add('hidden');
        hint.classList.remove('hidden');
        await sceneEl.systems['mindar-image-system'].start();
      } catch (err) {
        intro.classList.remove('hidden');
        hint.classList.add('hidden');
        alert('Não foi possível iniciar a câmera. Verifique a permissão e abra esta página em HTTPS.');
        console.error(err);
      }
    });

    sceneEl.addEventListener('targetFound', () => {
      hint.textContent = 'Imagem reconhecida! Morelimbau está em movimento.';
    });
    sceneEl.addEventListener('targetLost', () => {
      hint.textContent = 'Procure a ilustração Morelimbau e mantenha-a inteira no enquadramento.';
    });
  </script>
</body>
</html>
